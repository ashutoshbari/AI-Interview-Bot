<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        .header { background: #10b981; color: white; padding: 20px; text-align: center; border-radius: 10px 10px 0 0; }
        .content { padding: 20px; text-align: center; }
        .status-badge { display: inline-block; background: #ecfdf5; color: #059669; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 18px; margin: 20px 0; border: 1px solid #10b981; }
        .footer { text-align: center; font-size: 12px; color: #666; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Interview Status Update</h2>
        </div>
        <div class="content">
            <p>Hi <strong>{{ name }}</strong>,</p>
            <p>We're writing to let you know that your interview status has been updated:</p>
            
            <div class="status-badge">
                {{ status }}
            </div>

            <p>Log in to the portal to see more details or to proceed with the next steps.</p>
        </div>
        <div class="footer">
            &copy; 2026 AI Interview Bot. All rights reserved.
        </div>
    </div>
</body>
</html>
