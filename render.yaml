services:
  - type: web
    name: ai-interview-bot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: FRONTEND_URL
        value: "https://frontend-nine-tau-65.vercel.app"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./ai_interview.db
      - key: UPLOAD_DIR
        value: uploads
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: QUESTIONS_PER_INTERVIEW
        value: "12"
      - key: ENVIRONMENT
        value: production
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: INTERVIEWER_EMAIL
        sync: false
